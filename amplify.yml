version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npm install javascript-obfuscator --save-dev
    build:
      commands:
        - npm run build
        # keep dev.carlotorib.io and other non-production branches out of search results
        - if [ "$AWS_BRANCH" != "main" ]; then sed -i 's|<head>|<head><meta name="robots" content="noindex, nofollow">|' build/index.html; fi
        - npx javascript-obfuscator ./build --output ./build --config obfuscator-config.json
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*